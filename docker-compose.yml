services:
  app:
    build: .
    command: ["db:3306", "1000"]
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./db
    ports:
      - "33060:3306"
    healthcheck:
      # Check seeded data too: an open port alone does not mean imports finished.
      test: ["CMD-SHELL", "MYSQL_PWD=example mysql -h 127.0.0.1 -uroot -Dworld -Nse 'SELECT COUNT(*) FROM country' | grep -qx 239"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
