name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (no database)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Run unit tests and generate coverage
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Save unit test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            target/surefire-reports/
            target/site/jacoco/

  integration-tests:
    name: Integration tests (seeded MySQL)
    needs: unit-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Start and wait for the world database
        run: docker compose up --build --detach --wait --wait-timeout 180 db
      - name: Run unit and integration tests with coverage
        run: mvn --batch-mode --no-transfer-progress clean verify -Pintegration
      - name: Build and run the application container
        run: |
          docker compose build app
          docker compose run --rm app > target/application-report.txt
      - name: Save tests, coverage, JAR and application output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/semApp.jar
            target/application-report.txt
      - name: Upload coverage to Codecov
        if: success() && github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          files: target/site/jacoco/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Database diagnostics
        if: failure()
        run: docker compose logs db
      - name: Stop database
        if: always()
        run: docker compose down --volumes
